name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0

    - name: Get version + channel from tag
      id: get_version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        echo "version=${TAG}" >> $GITHUB_OUTPUT
        # v*-beta* builds beta, plain v* builds main; every channel attaches to the release named by the stable tag
        echo "release=${TAG%%-beta*}" >> $GITHUB_OUTPUT
        if [[ "$TAG" == *-beta* ]]; then
          echo "channel=beta" >> $GITHUB_OUTPUT
          echo "branch=beta" >> $GITHUB_OUTPUT
        else
          echo "channel=stable" >> $GITHUB_OUTPUT
          echo "branch=main" >> $GITHUB_OUTPUT
        fi

    - name: Stable release must exist before a beta attaches to it
      if: steps.get_version.outputs.channel != 'stable'
      run: |
        REL="${{ steps.get_version.outputs.release }}"
        if ! git ls-remote --exit-code --tags origin "refs/tags/${REL}" >/dev/null; then
          echo "tag ${REL} is not on origin - push the stable tag before ${{ steps.get_version.outputs.version }}" >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.11'

    - name: Cache PlatformIO
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-release-

    - name: Install PlatformIO
      run: pip install --upgrade platformio

    - name: Build firmware and collect artifacts
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release

        pio run -e AntiHunter-full
        test -f .pio/build/AntiHunter-full/firmware.bin
        cp .pio/build/AntiHunter-full/firmware.bin "release/antihunter-full-${VERSION}.bin"
        # bootloader + partitions MUST come from the fresh build (IDF/core version must match the app)
        cp .pio/build/AntiHunter-full/bootloader.bin release/
        cp .pio/build/AntiHunter-full/partitions.bin release/

        pio run -e AntiHunter-headless
        test -f .pio/build/AntiHunter-headless/firmware.bin
        cp .pio/build/AntiHunter-headless/firmware.bin "release/antihunter-headless-${VERSION}.bin"

        cp Dist/flashAntihunter.sh release/

    - name: Print the toolchain the bins were built with
      run: pio pkg list -e AntiHunter-full

    - name: Stage release assets with channel-unique names
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p publish
        cp release/antihunter-*.bin publish/
        cp release/bootloader.bin "publish/bootloader-${VERSION}.bin"
        cp release/partitions.bin "publish/partitions-${VERSION}.bin"
        cp release/flashAntihunter.sh publish/
        cd publish
        sha256sum *.bin flashAntihunter.sh > "SHA256SUMS-${VERSION}.txt"

    - name: Update Dist bins and web flasher manifests
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        BRANCH="${{ steps.get_version.outputs.branch }}"
        RAW="https://raw.githubusercontent.com/lukeswitz/AntiHunter/${BRANCH}/Dist"

        # Remove old versioned bins; keep bootloader, partitions, flashAntihunter.sh
        rm -f Dist/antihunter-*.bin

        cp "release/antihunter-full-${VERSION}.bin" "Dist/antihunter-full-${VERSION}.bin"
        cp "release/antihunter-headless-${VERSION}.bin" "Dist/antihunter-headless-${VERSION}.bin"
        # refresh bootloader + partitions from the build so they match the app's IDF/core
        cp release/bootloader.bin Dist/bootloader.bin
        cp release/partitions.bin Dist/partitions.bin

        mkdir -p docs/flasher

        CHANNEL="${{ steps.get_version.outputs.channel }}"
        CHANNEL_TITLE="$(echo "${CHANNEL}" | sed 's/^./\U&/')"

        # Manifest name carries the channel, and the body declares channel/variant
        # so docs/index.html can reject a manifest that does not match the selection.
        for VARIANT in full headless; do
          VARIANT_TITLE="$(echo "${VARIANT}" | sed 's/^./\U&/')"
          cat > "docs/flasher/manifest-${VARIANT}-${CHANNEL}.json" <<EOF
        {
          "name": "AntiHunter ${VARIANT_TITLE} - ${CHANNEL_TITLE} (${VERSION})",
          "version": "${VERSION}",
          "channel": "${CHANNEL}",
          "variant": "${VARIANT}",
          "new_install_prompt_erase": true,
          "builds": [
            {
              "chipFamily": "ESP32-S3",
              "parts": [
                { "path": "${RAW}/bootloader.bin", "offset": 0 },
                { "path": "${RAW}/partitions.bin", "offset": 32768 },
                { "path": "${RAW}/antihunter-${VARIANT}-${VERSION}.bin", "offset": 65536 }
              ]
            }
          ]
        }
        EOF
          # Legacy unsuffixed name, kept for cached copies of the old page.
          cp "docs/flasher/manifest-${VARIANT}-${CHANNEL}.json" "docs/flasher/manifest-${VARIANT}.json"
        done

    - name: Checkout channel branch and apply artifacts
      run: |
        BRANCH="${{ steps.get_version.outputs.branch }}"
        VERSION="${{ steps.get_version.outputs.version }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Stash the built artifacts so we can switch branches
        cp -r Dist /tmp/ah-dist
        cp -r docs/flasher /tmp/ah-flasher

        # Base on the freshest channel branch (avoids stale non-fast-forward)
        git fetch origin "${BRANCH}"
        git checkout -B "${BRANCH}" "origin/${BRANCH}"

        # Apply artifacts onto the branch
        rm -f Dist/antihunter-*.bin
        cp /tmp/ah-dist/antihunter-*.bin Dist/
        cp /tmp/ah-dist/bootloader.bin /tmp/ah-dist/partitions.bin Dist/
        mkdir -p docs/flasher
        cp /tmp/ah-flasher/manifest-*.json docs/flasher/

        git add Dist/antihunter-*.bin Dist/bootloader.bin Dist/partitions.bin docs/flasher/manifest-*.json
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "dist: update bins and flasher manifests for ${VERSION} (${{ steps.get_version.outputs.channel }})"
        for i in 1 2 3 4 5; do
          git push origin "HEAD:${BRANCH}" && break
          echo "push rejected, rebasing on latest ${BRANCH} (attempt ${i})"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}" || { git rebase --abort; exit 1; }
          sleep 3
        done

    - name: Publish flasher manifests to docs branch
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        CHANNEL="${{ steps.get_version.outputs.channel }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # docs/ (GitHub Pages) is served from main, so both channels' manifests
        # must land on main. Only this channel's files are touched - a beta
        # release can never rewrite the stable manifest.
        git fetch origin main
        git checkout -B main origin/main

        mkdir -p docs/flasher
        cp /tmp/ah-flasher/manifest-*-"${CHANNEL}".json docs/flasher/
        if [ "${CHANNEL}" = "stable" ]; then
          cp /tmp/ah-flasher/manifest-full.json /tmp/ah-flasher/manifest-headless.json docs/flasher/
        fi

        git add docs/flasher/manifest-*.json
        git diff --cached --quiet && echo "No manifest changes to commit" && exit 0
        git commit -m "docs: flasher manifests for ${VERSION} (${CHANNEL})"
        for i in 1 2 3 4 5; do
          git push origin HEAD:main && break
          echo "push rejected, rebasing on latest main (attempt ${i})"
          git fetch origin main
          git rebase origin/main || { git rebase --abort; exit 1; }
          sleep 3
        done

    - name: Create Release
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
      with:
        tag_name: ${{ steps.get_version.outputs.release }}
        name: ${{ steps.get_version.outputs.release }}
        files: publish/*
        prerelease: false
        body_path: docs/release-notes/notes.md
