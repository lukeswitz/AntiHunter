name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0

    - name: Get version + channel from tag
      id: get_version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        echo "version=${TAG}" >> $GITHUB_OUTPUT
        # This branch builds ESP32-C5 only; main/beta tags are built on those branches.
        echo "channel=c5" >> $GITHUB_OUTPUT
        echo "branch=feat/c5" >> $GITHUB_OUTPUT
        echo "prerelease=true" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.11'

    - name: Cache PlatformIO
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-release-

    - name: Install PlatformIO
      run: pip install --upgrade platformio

    - name: Build firmware and collect artifacts
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release

        pio run -e AntiHunter-c5-full
        test -f .pio/build/AntiHunter-c5-full/firmware.factory.bin
        cp .pio/build/AntiHunter-c5-full/firmware.bin "release/antihunter-c5-full-${VERSION}.bin"
        cp .pio/build/AntiHunter-c5-full/firmware.factory.bin "release/antihunter-c5-full-${VERSION}.factory.bin"
        # bootloader + partitions MUST come from the fresh build (IDF/core version must match the app)
        cp .pio/build/AntiHunter-c5-full/bootloader.bin release/bootloader-c5.bin
        cp .pio/build/AntiHunter-c5-full/partitions.bin release/partitions-c5.bin

        pio run -e AntiHunter-c5-headless
        test -f .pio/build/AntiHunter-c5-headless/firmware.factory.bin
        cp .pio/build/AntiHunter-c5-headless/firmware.bin "release/antihunter-c5-headless-${VERSION}.bin"
        cp .pio/build/AntiHunter-c5-headless/firmware.factory.bin "release/antihunter-c5-headless-${VERSION}.factory.bin"

        # The shell flasher builds its download URL from this version string.
        sed -i "s|^C5_VERSION=.*|C5_VERSION=\"${VERSION}\"|" Dist/flashAntihunter.sh
        cp Dist/flashAntihunter.sh release/

    - name: Generate checksums
      run: |
        cd release
        sha256sum *.bin flashAntihunter.sh > SHA256SUMS.txt

    - name: Update Dist bins and web flasher manifests
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        BRANCH="${{ steps.get_version.outputs.branch }}"
        CHANNEL="${{ steps.get_version.outputs.channel }}"
        RAW="https://raw.githubusercontent.com/lukeswitz/AntiHunter/${BRANCH}/Dist"

        rm -f Dist/antihunter-c5-*.bin

        cp "release/antihunter-c5-full-${VERSION}.factory.bin" "Dist/antihunter-c5-full-${VERSION}.factory.bin"
        cp "release/antihunter-c5-headless-${VERSION}.factory.bin" "Dist/antihunter-c5-headless-${VERSION}.factory.bin"
        cp release/bootloader-c5.bin release/partitions-c5.bin Dist/

        mkdir -p docs/flasher

        # The factory image holds bootloader + partitions + app at their offsets, so one part at 0 installs everything.
        for VARIANT in full headless; do
          VARIANT_TITLE="$(echo "${VARIANT}" | sed 's/^./\U&/')"
          cat > "docs/flasher/manifest-${VARIANT}-${CHANNEL}.json" <<EOF
        {
          "name": "AntiHunter ${VARIANT_TITLE} - C5 (${VERSION})",
          "version": "${VERSION}",
          "channel": "${CHANNEL}",
          "variant": "${VARIANT}",
          "new_install_prompt_erase": true,
          "builds": [
            {
              "chipFamily": "ESP32-C5",
              "parts": [
                { "path": "${RAW}/antihunter-c5-${VARIANT}-${VERSION}.factory.bin", "offset": 0 }
              ]
            }
          ]
        }
        EOF
        done

    - name: Checkout channel branch and apply artifacts
      run: |
        BRANCH="${{ steps.get_version.outputs.branch }}"
        VERSION="${{ steps.get_version.outputs.version }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        cp -r Dist /tmp/ah-dist
        cp -r docs/flasher /tmp/ah-flasher

        # Base on the freshest channel branch (avoids stale non-fast-forward)
        git fetch origin "${BRANCH}"
        git checkout -B "${BRANCH}" "origin/${BRANCH}"

        rm -f Dist/antihunter-c5-*.bin
        cp /tmp/ah-dist/antihunter-c5-*.bin Dist/
        cp /tmp/ah-dist/bootloader-c5.bin /tmp/ah-dist/partitions-c5.bin Dist/
        cp /tmp/ah-dist/flashAntihunter.sh Dist/
        mkdir -p docs/flasher
        cp /tmp/ah-flasher/manifest-*-c5.json docs/flasher/

        git add Dist/antihunter-c5-*.bin Dist/bootloader-c5.bin Dist/partitions-c5.bin Dist/flashAntihunter.sh docs/flasher/manifest-*-c5.json
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "dist: update C5 bins and flasher manifests for ${VERSION}"
        for i in 1 2 3 4 5; do
          git push origin "HEAD:${BRANCH}" && break
          echo "push rejected, rebasing on latest ${BRANCH} (attempt ${i})"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}" || { git rebase --abort; exit 1; }
          sleep 3
        done

    - name: Publish flasher manifests to docs branch
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Pages is served from main, so only manifest-*-c5.json lands there; S3 manifests are untouched.
        git fetch origin main
        git checkout -B main origin/main

        mkdir -p docs/flasher
        cp /tmp/ah-flasher/manifest-*-c5.json docs/flasher/

        git add docs/flasher/manifest-*-c5.json
        git diff --cached --quiet && echo "No manifest changes to commit" && exit 0
        git commit -m "docs: flasher manifests for ${VERSION} (c5)"
        for i in 1 2 3 4 5; do
          git push origin HEAD:main && break
          echo "push rejected, rebasing on latest main (attempt ${i})"
          git fetch origin main
          git rebase origin/main || { git rebase --abort; exit 1; }
          sleep 3
        done

    - name: Create Release
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: ${{ steps.get_version.outputs.version }}
        files: release/*
        prerelease: ${{ steps.get_version.outputs.prerelease }}
        generate_release_notes: true
